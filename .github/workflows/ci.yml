name: RC acceptance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-example:
    name: Authenticated browser and BFF acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the published release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[browser-test]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run authenticated acceptance
        run: python tests/acceptance.py

  authenticated-load:
    name: Authenticated BFF load test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the published release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[load-test]'

      - name: Run authenticated load profile
        run: python tests/load_test.py --output load-results.json

      - name: Retain load-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-load-results
          path: load-results.json
          if-no-files-found: error
