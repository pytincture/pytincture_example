name: RC acceptance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-example:
    name: Authenticated browser and BFF acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the published release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install . 'playwright>=1.58,<2'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run authenticated acceptance
        run: python tests/acceptance.py
