name: RC acceptance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-example:
    name: Authenticated browser and BFF acceptance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the published release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[browser-test]'

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run authenticated acceptance
        run: python tests/acceptance.py --output acceptance-results.json

      - name: Retain browser-acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-browser-results
          path: acceptance-results.json
          if-no-files-found: error

  authenticated-load:
    name: Authenticated BFF load test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the published release candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[load-test]'

      - name: Run authenticated load profile
        run: python tests/load_test.py --output load-results.json

      - name: Retain load-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-load-results
          path: load-results.json
          if-no-files-found: error

  rc-observation:
    name: Build RC1 observation record
    if: always()
    needs:
      - authenticated-example
      - authenticated-load
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the observed application and candidate
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Download browser evidence
        uses: actions/download-artifact@v7
        with:
          name: authenticated-browser-results
          path: observation-input/browser

      - name: Download load evidence
        uses: actions/download-artifact@v7
        with:
          name: authenticated-load-results
          path: observation-input/load

      - name: Test the observation contract
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build the RC1 observation
        run: |
          python scripts/build_rc_observation.py \
            --acceptance-result observation-input/browser/acceptance-results.json \
            --load-result observation-input/load/load-results.json \
            --output rc1-observation.json

      - name: Retain the RC1 observation
        uses: actions/upload-artifact@v7
        with:
          name: pytincture-rc1-observation
          path: |
            rc1-observation.json
            observation-input/browser/acceptance-results.json
            observation-input/load/load-results.json
          if-no-files-found: error
